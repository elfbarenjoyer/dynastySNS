name: Draft Calendar

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r draft-calendar/requirements.txt

      - name: Write and validate Yahoo OAuth token
        env:
          YAHOO_OAUTH_TOKEN: ${{ secrets.YAHOO_OAUTH_TOKEN }}
        run: |
          echo "$YAHOO_OAUTH_TOKEN" | base64 --decode > draft-calendar/yahoo_oauth.json
          sudo apt-get update -y && sudo apt-get install -y jq
          if [ ! -s draft-calendar/yahoo_oauth.json ]; then
            echo "ERROR: oauth file is empty; check the secret value" >&2
            exit 1
          fi
          if ! jq -e . draft-calendar/yahoo_oauth.json >/dev/null 2>&1; then
            echo "ERROR: oauth file is not valid JSON; update the secret with the full oauth json" >&2
            exit 1
          fi
          echo "Yahoo OAuth token written and validated"

      - name: Regenerate calendar feed
        run: python draft-calendar/export_draft_calendar.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar/draft.ics draft-calendar/leagues.json draft-calendar/state.json
          git diff --cached --quiet || git commit -m "Update draft calendar feed"

      - name: Push
        run: git push
